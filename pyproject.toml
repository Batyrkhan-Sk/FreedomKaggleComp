[project]
name = "kagglecomp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ijson>=3.5.1",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
kagglecomp = "kagglecomp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
